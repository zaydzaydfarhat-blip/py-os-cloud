name: Build and attach PY-OS Android APK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the APK to"
        required: true
        default: "0.1"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare release files
        run: |
          mkdir -p release
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          cp app/build/outputs/apk/debug/app-debug.apk "release/PY-OS-Cloud-${TAG}.apk"
          sha256sum release/*.apk > release/SHA256SUMS.txt

      - name: Attach APK to the existing GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
          files: |
            release/*.apk
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
