[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "py-os-cloud"
version = "0.1.0"
description = "A shared-core cloud desktop for PY-OS"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
py-os-cloud = "pyos_cloud.__main__:main"

[tool.setuptools]
packages = ["pyos_cloud"]
