plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pyos.cloud'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pyos.cloud'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.4.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
