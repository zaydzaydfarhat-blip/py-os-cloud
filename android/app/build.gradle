plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

chaquopy {
    defaultConfig {
        version = '3.11'
    }
}

android {
    namespace 'com.pyos.cloud'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pyos.cloud'
        minSdk 24
        ndk { abiFilters 'arm64-v8a' }

        targetSdk 35
        versionCode 2
        versionName '0.6.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}