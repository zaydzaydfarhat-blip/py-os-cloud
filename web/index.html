<style>
:root{font-family:Inter,system-ui,Segoe UI,sans-serif;color:#f4f6ff;background:#101827;font-synthesis:none}*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#101827}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit;border:1px solid #ffffff20;background:#263751;border-radius:9px;padding:8px 12px}button:hover{background:#385276}.desktop{height:100dvh;position:relative;overflow:hidden;background:radial-gradient(ellipse at 75% 15%,#426a91 0,#263e62 28%,transparent 58%),linear-gradient(135deg,#101827,#172d48 65%,#101827)}.desktop.light{background:radial-gradient(ellipse at 75% 15%,#d4e8ff,#85a9cf 45%,#557ba5);color:#172033}.desktop.light .window,.desktop.light .start,.desktop.light .taskbar{background:#f4f7fceF;color:#172033;border-color:#8094ad}.desktop.light button{background:#dce7f5;color:#172033;border-color:#9aacc2}.desktop-icons{position:absolute;inset:12px 12px 62px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:8px}.desktop-icon{width:84px;min-height:84px;border:1px solid transparent;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-align:center;padding:6px;text-shadow:0 1px 4px #000}.desktop-icon:hover,.desktop-icon:focus{background:#ffffff20;border-color:#ffffff35}.desktop-icon span:first-child{font-size:30px}.desktop-icon span:last-child{font-size:12px}.taskbar{height:50px;position:absolute;bottom:0;left:0;right:0;background:#0b1322df;backdrop-filter:blur(18px);border-top:1px solid #ffffff25;display:flex;align-items:center;gap:8px;padding:6px 12px;z-index:1000}.start-button{font-weight:700;background:#426eaa;border:0;padding:8px 14px}.task-apps{display:flex;gap:6px;flex:1;overflow:auto}.task-apps button{white-space:nowrap;padding:7px 10px}.clock{font-size:12px;text-align:right;min-width:75px}.start{position:absolute;bottom:58px;left:10px;width:min(340px,calc(100vw - 20px));padding:14px;background:#111d30f2;backdrop-filter:blur(18px);border:1px solid #ffffff30;border-radius:16px;z-index:1100;box-shadow:0 18px 55px #0008}.start.hidden{display:none}.start h2{font-size:16px;margin:4px 4px 12px}.app-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.app-launch{display:flex;align-items:center;gap:10px;text-align:left;padding:12px;background:#ffffff0c}.app-launch b{font-size:20px}.window{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:min(680px,calc(100vw - 24px));height:min(480px,calc(100dvh - 90px));min-width:min(280px,calc(100vw - 24px));min-height:220px;background:#172338f5;border:1px solid #ffffff35;border-radius:13px;box-shadow:0 22px 70px #0009;display:flex;flex-direction:column;overflow:hidden;z-index:10;resize:both}.titlebar{height:42px;flex:none;background:#243650;display:flex;align-items:center;justify-content:space-between;padding:0 9px 0 13px;cursor:move;user-select:none}.titlebar strong{font-size:13px}.win-controls{display:flex;gap:5px}.win-controls button{padding:3px 10px;border:0;background:#ffffff16}.win-controls .close{background:#b94353}.resize-grip{position:absolute;right:2px;bottom:2px;width:26px;height:26px;z-index:6;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 45%,#9db8d8 47%,#9db8d8 53%,transparent 55%,transparent 66%,#9db8d8 68%,#9db8d8 74%,transparent 76%)}.window-body{padding:15px;overflow:auto;flex:1}.window-body h2{margin:0 0 10px;font-size:20px}.window-body p{color:#aebbd0}.window-body input,.window-body textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #ffffff30;background:#0c1625;color:inherit}.window-body textarea{min-height:190px;resize:vertical}.row{display:flex;gap:8px;align-items:center;margin:9px 0}.row>*{min-width:0}.row input{flex:1}.file-row{display:flex;align-items:center;justify-content:space-between;padding:10px;border-bottom:1px solid #ffffff18}.muted{color:#aebbd0;font-size:13px}.browser-frame{width:100%;height:calc(100% - 52px);border:1px solid #ffffff25;border-radius:8px;background:white}.browser-wrap{height:100%;display:flex;flex-direction:column}.browser-wrap .row{margin-top:0}.browser-wrap{justify-content:flex-start}.browser-shortcuts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:14px 0}.browser-shortcuts button{min-height:54px}.toast{position:absolute;right:14px;top:14px;padding:10px 14px;border-radius:10px;background:#14243beF;border:1px solid #ffffff30;z-index:1500;display:none}.toast.show{display:block}@media(max-width:520px){.desktop-icons{gap:3px}.desktop-icon{width:72px;min-height:72px}.window{height:min(540px,calc(100dvh - 78px))}.taskbar{padding:5px}.task-apps button{font-size:11px}.clock{min-width:52px}}


.desktop-context-menu{position:absolute;z-index:2200;min-width:196px;padding:7px;background:#101d30f5;border:1px solid #ffffff35;border-radius:12px;box-shadow:0 14px 40px #0009;backdrop-filter:blur(16px);display:grid;gap:4px}
.desktop-context-menu button{width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;min-height:42px}
.desktop-context-menu button:hover{background:#ffffff18}
#gameStage,#gameStage *{-webkit-touch-callout:none}
#gameStage button{-webkit-user-select:none;user-select:none;touch-action:manipulation}

/* GLOBAL LONG-PRESS AND SELECTION CONTROL */
html,body,.desktop,.window,.start,.desktop-context-menu{-webkit-touch-callout:none}
body,.desktop,.desktop-icons,.desktop-icon,.app-launch,.taskbar,.window,.titlebar,.start,.desktop-context-menu,button{-webkit-user-select:none;user-select:none}
input,textarea,[contenteditable="true"]{-webkit-user-select:text;user-select:text}

/* Touch, mouse, keyboard, and accessibility improvements */
button{min-height:40px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.titlebar{touch-action:none;cursor:grab}.titlebar:active{cursor:grabbing}.desktop-icon,.app-launch{touch-action:manipulation}.window{touch-action:pan-y}.window-body{overscroll-behavior:contain}.window-body input,.window-body textarea{font-size:16px;min-height:42px}.win-controls button{min-width:42px;min-height:38px}.taskbar{padding-bottom:max(6px,env(safe-area-inset-bottom))}.start{max-height:calc(100dvh - 75px);overflow:auto}.desktop-icon:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #9cc7ff;outline-offset:2px}
@media(pointer:coarse){button{min-height:46px;padding:10px 13px}.desktop-icon{min-width:76px;min-height:82px}.titlebar{height:48px}.win-controls button{min-width:46px;min-height:42px}.taskbar{height:58px;gap:6px}.start{bottom:66px}.file-row{gap:10px}.file-row button{min-width:64px}}
@media(max-width:600px){.window{resize:both!important;min-width:220px!important;min-height:210px!important;width:min(94vw,680px)!important;height:min(72dvh,540px)!important;max-height:calc(100dvh - 70px)}.desktop-icons{inset:8px 6px 68px;gap:4px}.desktop-icon{width:76px}.window{left:50%!important;top:calc((100dvh - 58px)/2)!important;width:calc(100vw - 12px)!important;height:calc(100dvh - 70px)!important;max-height:calc(100dvh - 70px);resize:none;border-radius:12px}.window[data-max="1"]{height:calc(100dvh - 66px)!important}.window-body{padding:12px}.taskbar{height:58px;padding:4px 6px}.task-apps{gap:4px}.task-apps button{max-width:116px;overflow:hidden;text-overflow:ellipsis;font-size:11px;padding:7px}.clock{min-width:48px;font-size:11px}.start{left:6px;bottom:64px;width:min(340px,calc(100vw - 12px))}.row{flex-wrap:wrap}.row input{flex-basis:100%}.browser-wrap .row{flex-wrap:nowrap}.browser-wrap .row input{flex-basis:0}.file-row{align-items:flex-start}.toast{left:10px;right:10px;text-align:center}}
@media(hover:none){.desktop-icon:hover,button:hover{background:inherit}.desktop-icon:active,button:active{filter:brightness(1.2)}}
</style></head>
<body><div id="desktop" class="desktop"><div class="desktop-icons" id="desktopIcons"></div><div class="start hidden" id="startMenu"><h2>☁️ PY-OS Cloud</h2><div class="app-grid" id="startApps"></div></div><div class="toast" id="toast" role="status"></div><div class="taskbar"><button class="start-button" id="startBtn">⊞ Start</button><div class="task-apps" id="taskApps"></div><div class="clock" id="clock"></div></div></div>
<script>
const $=id=>document.getElementById(id), desktop=$('desktop');
// Stop the browser's native right-click/long-press menu throughout PY-OS.
document.addEventListener('contextmenu',e=>e.preventDefault(),true);
const apps=[['files','📁','File Manager'],['browser','🌐','Web Browser'],['notes','📝','Notes'],['calculator','🧮','Calculator'],['settings','⚙️','Settings'],['games','🎮','Mini Games'],['about','☁️','About PY-OS']];
let state={schema_version:1,settings:{theme:'dark',wallpaper:'default'},apps:[],files:[]}, windows=[], topZ=20, noteText='';
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2300)}
async function api(path,options={}){const r=await fetch(path,options);if(!r.ok){let d={};try{d=await r.json()}catch{}throw Error(d.error||'Server request failed')}return r}
async function save(){try{await api('/api/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(state)})}catch(e){toast('Save failed: '+e.message)}}
async function init(){try{state=await(await api('/api/state')).json();if(!state.settings)state.settings={theme:'dark',wallpaper:'default'};if(!Array.isArray(state.files))state.files=[];if(!Array.isArray(state.apps))state.apps=[];noteText=(state.apps.find(x=>x.id==='notes')||{}).content||''}catch(e){toast('Could not load saved data: '+e.message)}applyTheme();renderLaunchers();$('clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});setInterval(()=>$('clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),15000)}
function applyTheme(){desktop.classList.toggle('light',state.settings.theme==='light')}
function renderLaunchers(){const icons=$('desktopIcons'),menu=$('startApps');icons.innerHTML='';menu.innerHTML='';apps.forEach(([id,ico,name])=>{const b=document.createElement('button');b.className='desktop-icon';b.innerHTML='<span>'+ico+'</span><span>'+name+'</span>';b.onclick=()=>openApp(id);icons.append(b);const m=document.createElement('button');m.className='app-launch';m.innerHTML='<b>'+ico+'</b><span>'+name+'</span>';m.onclick=()=>{openApp(id);$('startMenu').classList.add('hidden')};menu.append(m)})}
$('startBtn').onclick=()=>$('startMenu').classList.toggle('hidden');document.addEventListener('pointerdown',e=>{if(!$('startMenu').contains(e.target)&&e.target!==$('startBtn'))$('startMenu').classList.add('hidden')});

/* Desktop long-press / right-click context menu */
let desktopHoldTimer=null,desktopHoldStart=null,desktopMenu=null;
function closeDesktopMenu(){if(desktopMenu){desktopMenu.remove();desktopMenu=null}}
function showDesktopMenu(x,y){
 closeDesktopMenu();
 const menu=document.createElement('div');desktopMenu=menu;menu.className='desktop-context-menu';
 menu.style.left=Math.max(8,Math.min(innerWidth-208,x))+'px';
 menu.style.top=Math.max(8,Math.min(innerHeight-220,y))+'px';
 menu.innerHTML='<button data-cmd="start">⊞ Open Start menu</button><button data-cmd="files">📁 Open File Manager</button><button data-cmd="games">🎮 Open Mini Games</button><button data-cmd="settings">⚙️ Personalize</button><button data-cmd="refresh">↻ Refresh desktop</button>';
 desktop.append(menu);
 menu.addEventListener('click',e=>{const b=e.target.closest('[data-cmd]');if(!b)return;const cmd=b.dataset.cmd;closeDesktopMenu();if(cmd==='start')$('startMenu').classList.toggle('hidden');else if(cmd==='refresh'){renderLaunchers();toast('Desktop refreshed')}else openApp(cmd)});
}
function isDesktopBlankTarget(target){return target===desktop||target===$('desktopIcons')}
desktop.addEventListener('pointerdown',e=>{
 if(e.pointerType!=='touch'||!isDesktopBlankTarget(e.target))return;
 desktopHoldStart={x:e.clientX,y:e.clientY};
 clearTimeout(desktopHoldTimer);
 desktopHoldTimer=setTimeout(()=>{if(desktopHoldStart){showDesktopMenu(desktopHoldStart.x,desktopHoldStart.y);desktopHoldStart=null}},550);
});
desktop.addEventListener('pointermove',e=>{if(desktopHoldStart&&Math.hypot(e.clientX-desktopHoldStart.x,e.clientY-desktopHoldStart.y)>12){clearTimeout(desktopHoldTimer);desktopHoldStart=null}});
for(const eventName of ['pointerup','pointercancel'])desktop.addEventListener(eventName,()=>{clearTimeout(desktopHoldTimer);desktopHoldStart=null});
desktop.addEventListener('contextmenu',e=>{
 if(e.target.closest('#gameStage,.game-controls')){e.preventDefault();return}
 if(isDesktopBlankTarget(e.target)){e.preventDefault();showDesktopMenu(e.clientX,e.clientY)}
});
document.addEventListener('pointerdown',e=>{if(desktopMenu&&!desktopMenu.contains(e.target))closeDesktopMenu()});

function openApp(id){const existing=windows.find(w=>w.dataset.app===id&&!w.classList.contains('minimized'));if(existing){existing.style.zIndex=++topZ;return}const app=apps.find(a=>a[0]===id);if(!app)return;const win=document.createElement('section');win.className='window';win.dataset.app=id;win.style.zIndex=++topZ;win.style.left=(Math.max(12,Math.min(innerWidth-350,innerWidth/2+(windows.length%4)*18)))+'px';win.style.top=(Math.max(12,Math.min(innerHeight-280,innerHeight/2+(windows.length%4)*14)))+'px';win.style.transform='translate(-50%,-50%)';win.innerHTML='<div class="titlebar"><strong>'+app[1]+' '+app[2]+'</strong><div class="win-controls"><button data-action="min">—</button><button data-action="max">□</button><button class="close" data-action="close">×</button></div></div><div class="window-body">'+contentFor(id)+'</div><div class="resize-grip" title="Drag to resize"></div>';desktop.append(win);windows.push(win);const task=document.createElement('button');task.textContent=app[1]+' '+app[2];task.onclick=()=>{win.style.display=win.style.display==='none'?'flex':'none';win.style.zIndex=++topZ};task.dataset.for=id;$('taskApps').append(task);win.querySelector('.win-controls').onclick=e=>{const a=e.target.dataset.action;if(a==='close'){win.remove();task.remove();windows=windows.filter(x=>x!==win)}if(a==='min')win.style.display='none';if(a==='max'){if(win.dataset.max==='1'){win.style.left='50%';win.style.top='48%';win.style.width='min(680px,calc(100vw - 24px))';win.style.height='min(480px,calc(100dvh - 90px))';win.dataset.max='0'}else{win.style.left='50%';win.style.top='calc((100dvh - 50px)/2)';win.style.width='calc(100vw - 18px)';win.style.height='calc(100dvh - 68px)';win.dataset.max='1'}}};win.addEventListener('pointerdown',()=>win.style.zIndex=++topZ);drag(win);resizeWindow(win);wireApp(id,win)}
function drag(win){const bar=win.querySelector('.titlebar');let sx=0,sy=0,ox=0,oy=0,moving=false;bar.addEventListener('pointerdown',e=>{if(e.target.closest('button')||e.button!==0)return;moving=true;bar.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;const r=win.getBoundingClientRect();ox=r.left+r.width/2;oy=r.top+r.height/2});bar.addEventListener('pointermove',e=>{if(!moving)return;e.preventDefault();win.style.left=(ox+e.clientX-sx)+'px';win.style.top=(oy+e.clientY-sy)+'px'});bar.addEventListener('pointerup',()=>moving=false);bar.addEventListener('pointercancel',()=>moving=false)}
function contentFor(id){if(id==='games')return gamesMarkup();if(id==='files')return '<h2>My Files</h2><p class="muted">PY-OS virtual files are stored in your PY-OS data folder, not your Android file system.</p><div class="row"><input id="newFileName" placeholder="New file name"><button id="newFile">Create</button></div><div id="fileList"></div>';if(id==='notes')return '<h2>Notepad</h2><p class="muted">Your note is saved automatically in PY-OS Cloud.</p><textarea id="notesArea" placeholder="Start writing..."></textarea><p class="muted" id="noteStatus">Ready</p>';if(id==='settings')return '<h2>Personalization</h2><p>Choose your desktop appearance.</p><div class="row"><button id="darkTheme">Dark theme</button><button id="lightTheme">Light theme</button></div><p class="muted">More settings will arrive in future updates.</p>';if(id==='browser')return '<div class="browser-wrap"><h2>🌐 Web Browser</h2><p class="muted">Enter a website and press Open. Sites open in a new tab because many websites block being shown inside another page.</p><div class="row"><input id="browserUrl" value="https://www.google.com" aria-label="Website address" placeholder="https://example.com"><button id="goBrowser">Open</button></div><div class="browser-shortcuts"><button data-site="https://www.google.com">Google</button><button data-site="https://www.youtube.com">YouTube</button><button data-site="https://www.wikipedia.org">Wikipedia</button><button data-site="https://github.com">GitHub</button></div><p class="muted" id="browserStatus">Your website will open in a new browser tab.</p></div>';if(id==='calculator')return '<h2>Calculator</h2><input id="calcDisplay" value="0" readonly style="font-size:26px;text-align:right;margin-bottom:10px"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">'+['7','8','9','÷','4','5','6','×','1','2','3','−','0','.','C','+','='].map(x=>'<button class="calcKey">'+x+'</button>').join('')+'</div>';return '<h2>Welcome to PY-OS Cloud</h2><p>A desktop environment running in your browser, powered by your local Python server.</p><p><b>Included now</b></p><ul><li>Desktop icons and Start menu</li><li>Taskbar and movable app windows</li><li>File Manager with virtual files</li><li>Web Browser window</li><li>Notes, Calculator, and Settings</li></ul><p class="muted">Backup/import and the Android APK are planned for a later release.</p>'}
function wireApp(id,win){const q=s=>win.querySelector(s);if(id==='games'){wireGames(win);return}if(id==='settings'){q('#darkTheme').onclick=()=>setTheme('dark');q('#lightTheme').onclick=()=>setTheme('light')}if(id==='notes'){const area=q('#notesArea');area.value=noteText;area.addEventListener('input',()=>{noteText=area.value;const item=state.apps.find(x=>x.id==='notes');if(item)item.content=noteText;else state.apps.push({id:'notes',content:noteText});q('#noteStatus').textContent='Saving…';clearTimeout(area._saveTimer);area._saveTimer=setTimeout(async()=>{await save();q('#noteStatus').textContent='Saved'},450)})}if(id==='files'){renderFiles(win);q('#newFile').onclick=async()=>{const name=q('#newFileName').value.trim();if(!name)return toast('Enter a file name');if(state.files.some(f=>f.name===name))return toast('That file already exists');state.files.push({name,content:''});await save();q('#newFileName').value='';renderFiles(win)}}if(id==='browser'){const go=()=>{let url=q('#browserUrl').value.trim();if(!url)return;if(!/^https?:\\/\\//i.test(url))url='https://'+url;q('#browserUrl').value=url;const tab=window.open(url,'_blank','noopener,noreferrer');q('#browserStatus').textContent=tab?'Opened in a new browser tab.':'Pop-up blocked. Allow pop-ups for this local PY-OS page, then press Open again.'};q('#goBrowser').onclick=go;q('#browserUrl').addEventListener('keydown',e=>{if(e.key==='Enter')go()});qAll(win,'[data-site]').forEach(button=>button.onclick=()=>{q('#browserUrl').value=button.dataset.site;go()})}if(id==='calculator'){let expression='';const display=q('#calcDisplay');qAll(win,'.calcKey').forEach(b=>b.onclick=()=>{const k=b.textContent;if(k==='C'){expression='';display.value='0';return}if(k==='='){try{if(!/^[0-9+*/(). -]+$/.test(expression))throw Error();const result=Function('"use strict";return ('+expression+')')();if(!Number.isFinite(result))throw Error();display.value=String(result);expression=String(result)}catch{display.value='Error';expression=''}return}expression+=({'÷':'/','×':'*','−':'-'}[k]||k);display.value=expression})}}
function qAll(root,s){return [...root.querySelectorAll(s)]}
async function setTheme(theme){state.settings.theme=theme;applyTheme();await save();toast('Theme saved')}
function renderFiles(win){const list=win.querySelector('#fileList');list.innerHTML='';if(!state.files.length){list.innerHTML='<p class="muted">No files yet. Create a text file above.</p>';return}state.files.forEach((file,index)=>{const row=document.createElement('div');row.className='file-row';const name=document.createElement('span');name.textContent='📄 '+file.name;const actions=document.createElement('div');const open=document.createElement('button');open.textContent='Open';open.onclick=()=>editFile(win,index);const del=document.createElement('button');del.textContent='Delete';del.onclick=async()=>{state.files.splice(index,1);await save();renderFiles(win)};actions.append(open,del);row.append(name,actions);list.append(row)})}
function editFile(win,index){const file=state.files[index],body=win.querySelector('.window-body');body.innerHTML='<h2></h2><p class="muted">Text file</p><textarea id="fileEditor"></textarea><div class="row"><button id="saveFile">Save</button><button id="backFiles">Back</button></div>';body.querySelector('h2').textContent=file.name;body.querySelector('#fileEditor').value=file.content||'';body.querySelector('#saveFile').onclick=async()=>{file.content=body.querySelector('#fileEditor').value;await save();toast('File saved')};body.querySelector('#backFiles').onclick=()=>{body.innerHTML=contentFor('files');wireApp('files',win)}}

function resizeWindow(w){const g=w.querySelector('.resize-grip');let x,y,a,b;g.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();g.setPointerCapture(e.pointerId);const r=w.getBoundingClientRect();x=e.clientX;y=e.clientY;a=r.width;b=r.height});g.addEventListener('pointermove',e=>{if(!g.hasPointerCapture(e.pointerId))return;w.style.setProperty('width',Math.max(220,Math.min(innerWidth-16,a+e.clientX-x))+'px','important');w.style.setProperty('height',Math.max(210,Math.min(innerHeight-70,b+e.clientY-y))+'px','important')});}

const arcadeNouns=['Galaxy','Neon','Pixel','Turbo','Crystal','Shadow','Cosmic','Retro','Cyber','Jungle','Ocean','Desert','Frozen','Mystic','Solar','Lunar','Quantum','Thunder','Rainbow','Phantom'];
const arcadeKinds=['Rush','Quest','Blitz','Puzzle','Trials','Challenge','Arena','Adventure','Dash','Legends'];
const arcadeEngines=['reaction','memory','math','pattern','target','sequence','focus','speed','logic','survival'];
const arcadeModes=['Classic','Timed','Marathon','Zen','Hardcore','Reverse','Rush','Precision','Endless','Nightmare'];
const arcadeGames=Array.from({length:1000},(_,i)=>({id:i+1,name:arcadeNouns[Math.floor(i/10)%arcadeNouns.length]+' '+arcadeKinds[i%arcadeKinds.length]+' '+String(i+1).padStart(3,'0'),engine:arcadeEngines[i%arcadeEngines.length],seed:i+1}));
const arcadeModeList=Array.from({length:1000},(_,i)=>({id:i+1,name:arcadeModes[Math.floor(i/100)]+' '+['I','II','III','IV','V','VI','VII','VIII','IX','X'][i%10]+' · '+String(i+1).padStart(3,'0'),speed:0.7+(i%10)*0.12,goal:5+(i%20),time:15+(i%6)*5}));
